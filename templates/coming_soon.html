<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title if page_title else "Coming Soon | Lukode AI & Software Quality" }}</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="New quality engineering and testing services under development at Lukode AI & Software Quality. Check back soon or contact us directly.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://lukode.net/coming-soon">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lukode.net/coming-soon">
    <meta property="og:title" content="{{ page_title if page_title else 'Coming Soon | Lukode AI & Software Quality' }}">
    <meta property="og:description" content="New quality engineering and testing services under development at Lukode AI & Software Quality. Check back soon or contact us directly.">
    <meta property="og:image" content="https://lukode.net{{ url_for('static', filename='images/hero-diagnostics.jpg') }}">
    <meta property="og:site_name" content="Lukode AI & Software Quality">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://lukode.net/coming-soon">
    <meta name="twitter:title" content="{{ page_title if page_title else 'Coming Soon | Lukode AI & Software Quality' }}">
    <meta name="twitter:description" content="New quality engineering and testing services under development at Lukode AI & Software Quality. Check back soon or contact us directly.">
    <meta name="twitter:image" content="https://lukode.net{{ url_for('static', filename='images/hero-diagnostics.jpg') }}">
    
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/Logo_dark_no_bg_cropped.png') }}" alt="Lukode AI & Software Quality" class="logo-img">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}#services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}#about">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}#our-why">Our Why</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-navbar ms-lg-3" href="{{ url_for('home') }}#contact">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Coming Soon Section -->
    <section id="coming-soon" class="d-flex align-items-center" style="min-height: 100vh;">
        <div class="container">
            <div class="row justify-content-center text-center">
                <div class="col-lg-8">
                    <div class="coming-soon-content">
                        <i class="fas fa-tools coming-soon-icon mb-4"></i>
                        <h1 class="display-4 mb-4">Coming Soon</h1>
                        <p class="lead mb-5">We're working hard to bring you this service. Please check back soon or contact us for more information.</p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{{ url_for('home') }}" class="btn btn-outline-primary px-4 py-2">Back to Home</a>
                            <a href="{{ url_for('home') }}#contact" class="btn btn-primary px-4 py-2">Contact Us</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <p class="mb-0">&copy; 2026 Lukode Łukasz Jaroszewski. All rights reserved. | <a href="{{ url_for('privacypolicy') }}" id="privacy-policy-link">Privacy Policy</a></p>
                </div>
                <div class="col-md-6 text-center text-md-end mt-3 mt-md-0">
                    <div class="social-links">
                        <a href="{{ url_for('blog') }}" id="blog-link">Blog</a>
                        <a href="mailto:contact@lukode.net" aria-label="Email"><i class="fas fa-envelope"></i></a>
                        <a href="https://www.linkedin.com/company/lukode" aria-label="LinkedIn" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
